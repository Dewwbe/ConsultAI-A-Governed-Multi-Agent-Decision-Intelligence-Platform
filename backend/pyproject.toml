[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consultai"
version = "0.1.0"
description = "Governed multi-agent consulting delivery platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "langgraph>=0.2",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "PyJWT[crypto]>=2.8",
  "langgraph-checkpoint-sqlite>=2.0",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
azure = [
  "openai>=1.40",
  "azure-search-documents>=11.6",
  "azure-cosmos>=4.7",
  "azure-identity>=1.17",
  "azure-keyvault-secrets>=4.8",
  "databricks-sql-connector>=3.3",
]
mlops = ["mlflow>=2.16"]
observability = [
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "azure-monitor-opentelemetry-exporter>=1.0.0b25",
  "mlflow-skinny>=2.16",
  "alembic>=1.13",  # MLflow database backends (the file store is deprecated)
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["C408"]
