[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consultai"
version = "0.1.0"
description = "Governed multi-agent consulting delivery platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "langgraph>=0.2",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "httpx>=0.27",
]

[project.optional-dependencies]
azure = [
  "openai>=1.40",
  "azure-search-documents>=11.6",
  "azure-cosmos>=4.7",
  "azure-identity>=1.17",
  "azure-keyvault-secrets>=4.8",
  "databricks-sql-connector>=3.3",
]
mlops = ["mlflow>=2.16"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
